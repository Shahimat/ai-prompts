key: entry-roles
title: Окно ролей установщика v3
status: planned
why: Сохранить непринятый тикет role-window без обязательных локальных ролей.
description: |
  Источник — entry-roles.expect.ts, results пуст. Перед работой сверить
  текущий продукт; это не обязательная установка ролей в ai-prompts.
  init --roles пишет выбранные роли и skills-привязки operator-centric,
  повторный запуск не затирает пользовательское. Без флага окно выбора
  researcher/executor/judge/librarian входит в установку сразу, с точной
  командой повторного запуска, не откладывается на потом.
  Watch-request/triage вне defaults: без модуля watchers отказ с маршрутом
  contract-setup. Planner должен иметь канонический источник для адаптера
  либо другой явно выбранный источник; в историческом sync он отсутствовал.
  Шаблоны AGENTS пакета синхронны v3-канону (антилазейка «быстро»,
  сценарии); исторический целевой fallback pin 0.1.7 требует сверки
  с текущей релизной политикой, не принудительного отката версии.
  Детект отличает plugin от plugins: неверный ключ с @shahimat/oc3 не
  v3-ok, причина объяснена; unit-тест. Отчёт печатает канонический состав
  core-skills/agents, SHA частей заполняется штатным source-sync.
  Source-sync описывает немедленное окно ролей; тесты фильтрации, merge,
  watch-отказа, npm run ci; версии/пины не менять в этом тикете.
  Чеклист: chore — окно/детект/тесты; docs — источник и маршрут выбора.
tasks:
  blocker: []
  high: []
  medium:
    - 'Явный выбор ролей, корректный plugin detect и идемпотентная поставка v3 → chore'
  low:
    - 'Канонический источник planner для продуктовых адаптеров → chore → нужен выбор источника'
depends_on: []
