project:
  - path: context/project.yml
    summary: Реквизиты и checkpoint выбранного v2
  - path: context/workflow.md
    summary: Сценарии, исходы, инструменты, тикеты и коммиты
  - path: context/views/goals.yaml
    summary: Живая YAML-очередь, только по запросу работы или статуса
contract:
