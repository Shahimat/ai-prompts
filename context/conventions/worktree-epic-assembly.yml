key: worktree-epic-assembly
summary: При необязательной сборке worktrees нельзя вслепую копировать поверх нового HEAD
rule: |
  Если пользователь выбрал worktrees, при сборке несмерженных веток поверх
  ушедшего вперёд main сверяй каждый переносимый файл с HEAD. Слепой cp
  может откатить параллельные изменения. Обязательного worktree-процесса нет.
reason: Сборка эпики 2026-11-03 откатила четыре места ea7c390 и вернула старые тесты; обнаружено проверками.
