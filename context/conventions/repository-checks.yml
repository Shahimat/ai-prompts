key: repository-checks
summary: CI репозитория и границы semantic-приёмки
rule: |
  Итоговая проверка репозитория — npm run ci. Её фактический состав задаёт
  package.json и scripts/verification.ts, не исторические отчёты.
  models:test входит в CI и доступен отдельно; полный CI PASS нельзя
  выводить только из targeted tests.
  Смысловые ожидания проверяются независимо, когда это входит в задачу;
  обязательного ролевого конвейера нет. Заголовки it правит пользователь,
  пороги — верхние границы из намерения. Не ослабляй их ради зелёного отчёта.
