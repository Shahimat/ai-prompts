key: typescript
summary: Строгие TS-ограничения и границы пакетов
rule: |
  Без as T, non-null assertion !, any, == и неявных приведений.
  Данные сужаются проверками shared/guards.ts. Пути вверх ../ запрещены:
  используй алиасы #…. Комментарии запрещены, кроме якорей // expect:KEY.
  Границы слоёв пакетов определены в design/packages.md.
