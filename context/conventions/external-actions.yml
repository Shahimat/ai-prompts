key: external-actions
summary: Автономия внешних действий сохранена без обязательных ролей
rule: |
  Самостоятельно разрешены browser.navigate, browser.snapshot,
  browser.screenshot. browser.submit и vcs.publish требуют явного согласования.
  vcs.write агенту запрещён: git/arc write выполняет пользователь.
  Разрешение публикации не отменяет запрета самостоятельной VCS-записи.
  Другие внешние изменения не получают автоматического разрешения;
  делегирование и смена контракта не расширяют права. Независимые глобальные
  guards и ограничения среды сохраняются; глобальные настройки без
  отдельного разрешения не меняются.
