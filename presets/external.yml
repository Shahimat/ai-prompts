# Внешний контекст: отдельный репозиторий-оверлей поверх живого проекта.
# Заменяет контракт external-project-context-v2.
key: external
title: Внешний контекст — оверлей поверх живого проекта
contract: agent-operational-contract-v3
modules:
  - key: domain
  - key: manuals
  - key: goals
  - key: ticket-commits
    answers:
      mode: "on"
  - key: harness
    answers:
      checks: [changelog, context-index, adapters]
      adapters: [claude-code]
  - key: external-context
    answers:
      namespaces: [systems, org, processes, knowledge]
      starter-manuals: [onboarding, create-ticket, request-access]
      target-access: url-only
      legacy-v1: "no"
