- key: docs-delta-fallback
  summary: ручной фолбэк docs-delta противоречит docs-guard — при недоступном раннере ролей легитимного пути применить дельту нет
  rule: |
    Ручной фолбэк docs-delta («собери дельту и примени вручную»)
    противоречит docs-guard («документацию пишет только librarian»): при
    недоступном раннере ролей легитимного пути применить дельту у агента
    не-librarian нет.
  reason: |
    сессия 2026-11-03 — runner claude упал с кодом 127, harness предписал
    ручной apply, docs-guard отклонил запись дельты агенту не-librarian;
    tension воспроизведён дважды (субагент general и основная сессия)
- key: expectations-repo-scan
  summary: сканеры исходников в expectations должны пропускать gitignored-каталоги, минимум .opencode — реализация числится открытой задачей
  rule: |
    Сканеры исходников, из которых собираются expectations-прогоны,
    должны исключать gitignored-каталоги; минимум — `.opencode`:
    параллельные worktrees не должны попадать в прогоны основного
    checkout. Правило — требование к целевому поведению: skip-regex в
    repoSources пока не исключает ни gitignored-каталоги, ни `.opencode`,
    реализация числится открытой задачей.
  reason: |
    без исключения крит Patterns.home в основном checkout падал дважды
    за сессию 2026-11-03 — сначала 6 путей, затем 20, по два файла на
    каждый worktree; после выноса worktrees прогон зелёный
- key: index-rebuild
  summary: правка промпта, паттерна, модуля или skill — пересборка prompts/index.yml в том же коммите
  rule: |
    После правки любого файла из prompts/, patterns/, skills/, agents/,
    presets/ запусти `npm run index:build` и включи обновлённый
    `prompts/index.yml` в тот же коммит: CI гоняет `npm run index:check`
    и валит билд при рассинхроне SHA.
- key: worktree-epic-assembly
  summary: сборка эпики из несмерженных worktrees поверх поехавшего main — сверять каждый переносимый файл с HEAD, без слепого cp
  rule: |
    При сборке эпики из несмерженных worktrees поверх main, ушедшего
    вперёд, сверяй каждый переносимый файл с HEAD: слепой `cp` откатывает
    правки параллельных коммитов.
  reason: |
    union эпики 2026-11-03 откатил 4 места коммита ea7c390 (DEFAULT_MODEL,
    литералы roles.expect, 2 строки v3-промпта) и вернул claude-тесты cp
    адаптерного теста из ветки до тикета 7; поймано expect/ci после сборки
