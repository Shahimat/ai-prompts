# Автомат source/sync: синхронизация проекта с источниками промптов.
# Агент работает в update, остальное — скрипт.
# Схема — expectations/schemas/harness-fsm.schema.json.
harness: source/sync
description: Синхронизация с источниками — версия harness, обновление агентом, пересборка и проверка
initial: outdated

limits:
  # refresh — возвраты в update после провала refresh.
  refresh: 3

states:
  outdated:
    actor: script
    action: harness-outdated
    on:
      done: update
  update:
    actor: model
    action: source-update
    on:
      done: refresh
  refresh:
    actor: script
    action: source-refresh
    on:
      ok: done
      fail:
        - { to: update, count: refresh }
        - failed
  failed:
    actor: user
    action: report-failure
    on:
      retry: { to: update, reset: [refresh] }
  done:
    final: true
