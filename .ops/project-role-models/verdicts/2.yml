dod_checks:
  - key: single-manual-manifest
    status: pass
    evidence: >-
      manifest.json:1–5 — «"version": 1», «"default": "openai/gpt-6.1-sol-fast"», «"roles": {}».
      packages/ai-core/src/lib/project-models.ts:43–98 — строгая схема version/default/roles,
      проверка model IDs, ошибка JSON и разрешение exact context → base role → default.
      Строка 98: «return { model: manifest.default, origin: `${MODEL_MANIFEST}:default` };».
      git diff .oc3/project.yml удаляет только старые четыре roles.models; roles.exceptions и briefing сохранены.
    reason: >-
      Одна ручная декларация задаёт общий default без variant; overrides не являются whitelist.
      Нет второго локального ручного перечня моделей в root opencode.jsonc; native настройки — производные.
