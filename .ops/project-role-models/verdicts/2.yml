      packages/ai-core/src/lib/model-plan.ts:5–9 использует локальные manifest/config и computeSync.
      packages/ai-core/test/project-models.test.ts:58–71, 99–113 — invalid fail-fast, idempotence и check drift без записи.
      Серийный лог:11,28 — «models check: ok».
    reason: >-
      Обычный script без AI/сети, один детерминированный план для adapters/models.
      Независимые проверки run 1 остаются применимыми к неизменённым этим финалом core-файлам:
