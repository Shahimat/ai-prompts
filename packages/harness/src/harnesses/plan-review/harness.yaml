# Автомат plan-review: события выводит команда hook из событий сессии
# планера, модель их не объявляет. Действия — имена из реестра, выражений нет.
# Схема — expectations/schemas/harness-fsm.schema.json; граф совпадает с блоком
# fsm в expectations/harness-plan-review.expect.ts.
harness: plan-review
description: Планер ожиданий — запрос, сбор контекста, запись ожиданий, ревью судьёй
initial: awaiting_input

limits:
  # cycles — полные циклы composing → review → analyze без чистого ревью.
  cycles: 3
  # build — блокировки Stop подряд, пока файл ожиданий не собирается.
  build: 3

models:
  planner: opus
  judge: opus

states:
  awaiting_input:
    actor: user
    action: planner-await
    on:
      request: { to: gathering, reset: [cycles] }
      exit: finished
  gathering:
    actor: model
    action: planner-gather
    on:
      gathered: composing
  composing:
    actor: model
    action: planner-compose
    on:
      written: review
      unclear: clarify_form
  clarify_form:
    actor: user
    action: planner-clarify
    on:
      answered: composing
  review:
    actor: model
    action: plan-judge
    on:
      reviewed: analyze
  analyze:
    actor: model
    action: plan-analyze
    on:
      remarks:
        - { to: composing, count: cycles }
        - awaiting_input
      clean: awaiting_input
  finished:
    final: true
